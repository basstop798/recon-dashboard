name: CI

on:
  # Every branch, not just master. A gate that only runs on master cannot
  # protect work in progress: feat/ai-copilot sat for days with no CI run at
  # all, so "the tests are green" was a claim nobody could audit.
  push:
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
